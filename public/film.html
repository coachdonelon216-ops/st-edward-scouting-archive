<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opponent Film | St. Edward Basketball</title><style>
:root{--green:#003e32;--dark:#001e19;--gold:#f4c84a}*{box-sizing:border-box}body{margin:0;background:#00291f;color:white;font:15px Arial,sans-serif}body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(0,26,21,.94),rgba(0,30,24,.72)),url('/Gym.jpg') center/cover;z-index:-1}header{background:#002e25;border-bottom:2px solid var(--gold);padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:14px;color:var(--gold);font-size:22px;font-weight:800;letter-spacing:1px}.brand small{display:block;color:white;font-size:11px;letter-spacing:2px}.brand img{width:70px;height:60px;object-fit:contain}nav{margin-left:auto;display:flex;gap:15px}a{color:inherit;text-decoration:none}nav a{padding:9px}nav a.active{color:var(--gold);border-bottom:2px solid var(--gold)}main{max-width:1550px;margin:auto;padding:24px}.page-layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:22px;align-items:start}.schedule-sidebar{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;background:rgba(0,34,28,.94);border:1px solid #b99a43;border-radius:9px;padding:15px}.schedule-sidebar h2{font-size:16px;color:var(--gold);margin:0 0 12px;letter-spacing:1px}.schedule-link{display:block;padding:10px 7px;border-bottom:1px solid #426e61;font-size:13px}.schedule-link:hover,.schedule-link:focus{background:#145344;color:var(--gold)}.schedule-date{display:block;color:#c9d9d3;font-size:11px;margin-bottom:3px}.page-content{min-width:0}h1{font-size:34px;margin:10px 0}.film-heading{display:flex;align-items:center;gap:13px}.film-nike{width:52px;height:36px;object-fit:contain;flex:none}p{color:#e3e8e5}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 24px}input,select{background:#002e25;color:white;border:1px solid #a78e48;border-radius:7px;padding:12px;font:inherit}input{min-width:260px;flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}.card{background:rgba(0,34,28,.92);border:1px solid #b99a43;border-radius:9px;padding:15px;display:flex;flex-direction:column;gap:11px;min-height:245px}.cardhead{display:flex;align-items:center;gap:12px;min-height:82px}.logo{height:76px;width:86px;object-fit:contain;flex-shrink:0}.fallback{width:86px;height:76px;display:grid;place-items:center;font-weight:bold;color:var(--gold);border:1px dashed #6c775c;border-radius:6px}.team{font-weight:800;text-transform:uppercase;line-height:1.3}.meta{color:#c9d9d3;font-size:13px;margin-top:6px}.actions{display:grid;gap:7px;margin-top:auto}.action{display:block;border:1px solid #426e61;border-radius:5px;text-align:center;padding:10px;font-size:12px;font-weight:bold;background:#003e32}.action.gold{background:var(--gold);color:#00251d;border-color:var(--gold)}.action.disabled{opacity:.58;cursor:not-allowed}.notice{padding:12px;border-left:3px solid var(--gold);background:#003c32;margin:0 0 20px;font-size:13px}.empty{padding:35px;text-align:center}footer{background:linear-gradient(90deg,#003b30,#004a3b,#003b30);border-top:2px solid var(--gold);text-align:center;margin-top:45px;padding:22px}footer img{max-width:min(380px,90vw);height:75px;object-fit:contain;mix-blend-mode:screen}@media(max-width:850px){.page-layout{grid-template-columns:1fr}.schedule-sidebar{position:static;max-height:260px}}@media(max-width:700px){nav{margin-left:0}header{padding:12px}main{padding:15px}h1{font-size:27px}}
</style></head><body><header><div class="brand"><img src="/01-SEHS-Eagle-E.png" alt="St. Edward Eagle logo" onerror="this.style.display='none'"><div>ST. EDWARD<small>BASKETBALL SCOUTING ARCHIVE</small></div></div><nav><a href="/">SCOUTING REPORTS</a><a href="/film.html" class="active">OPPONENT FILM</a><a href="/playbook.html">PLAYBOOK</a><a href="/practice.html">PRACTICE PLANNER</a></nav></header><main><div class="page-layout"><aside class="schedule-sidebar" aria-label="Season schedule"><h2>2026–27 SCHEDULE</h2><div id="schedule-list">Loading schedule…</div></aside><div class="page-content"><h1 class="film-heading"><img src="https://cdn.simpleicons.org/nike/FFFFFF" alt="White Nike swoosh" class="film-nike"> OPPONENT FILM</h1><p>2026–27 opponent film, scouting reports and game notes.</p><div class="controls"><input id="search" placeholder="Search opponents or dates" aria-label="Search opponents"><select id="season"><option>2026–27 Season</option></select></div><div id="cards" class="grid"></div></div></div></main><footer><img src="/designed-by-signature.png" alt="Designed by Conor Patrick Donelon"></footer><script>
const names={'Avon':'Avon Eagles.png','Brush':'Brush High School.png',"St. John's Jesuit":'St. Johns Jesuit.png','SVSM':'STVM.png','Sandusky':'Sandusky Blue Streaks.png','Benedictine':'9e574c08e711df49063fe557f14d172725f5f964.png','Perrysburg':'Perrysburg.png','Euclid':'Euclid.png','Walsh Jesuit':'WJ.png','VASJ':'Villa Angela-St. Joseph Vikings.png','St. Ignatius':'St. Ignatius WIldcats.png','Warrensville Heights':'Warrensville Heights.png','Padua':'Padua Bruins.png','Reynoldsburg':'Reynoldsburg.png','Upper Arlington':'Upper Arlington.png','Brooklyn':'Brooklyn Hurricanes.png','Lutheran West':'Lutheran West Longhorns.png','Lutheran East':'Lutheran East Falcons.png','Olmsted Falls':'Olmsted Falls.png','Fairview':'updated_logo_.png','Lakewood':'Lakewood Rangers.png'};
const $=id=>document.getElementById(id),safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let schedule=[],reports=[];
function render(){const q=$('search').value.toLowerCase(),rows=schedule.filter(g=>(g.team+' '+g.date).toLowerCase().includes(q));$('cards').innerHTML=rows.map((g,i)=>{const reportsFor=reports.filter(r=>r.team?.toLowerCase()===g.team.toLowerCase());const logo=names[g.team];const image=logo?'<img class="logo" src="/logos/'+encodeURIComponent(logo)+'" alt="'+safe(g.team)+' logo" onerror="this.outerHTML=\'<span class=&quot;fallback&quot;>Logo pending</span>\'">':'<span class="fallback">Logo pending</span>';const when=new Date(g.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});return '<article class="card" id="game-'+schedule.indexOf(g)+'"><div class="cardhead">'+image+'<div><div class="team">'+safe(g.team)+'</div><div class="meta">'+when+'<br>'+(g.site==='at'?'Away':'Home / vs')+(g.note?' · '+safe(g.note):'')+'</div></div></div><div class="actions"><a class="action gold" href="/opponent.html?game='+schedule.indexOf(g)+'">OPEN OPPONENT DETAILS</a><span class="action disabled" title="Awaiting authorized Hudl links">▶ HUDL FILM — PENDING</span>'+(reportsFor.length?'<a class="action" href="/api/report?file='+encodeURIComponent(reportsFor[0].file)+'" target="_blank" rel="noopener">OPEN SCOUTING REPORT ('+reportsFor.length+')</a>':'<span class="action disabled">SCOUTING REPORT — NOT AVAILABLE</span>')+'<span class="action disabled">GAME NOTES — COMING SOON</span></div></article>'}).join('')||'<div class="empty">No matching opponents.</div>'}
function renderSchedule(){ $('schedule-list').innerHTML=schedule.map((g,i)=>'<a class="schedule-link" href="#game-'+i+'"><span class="schedule-date">'+new Date(g.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})+'</span>'+(g.site==='at'?'@ ':'vs ')+safe(g.team)+'</a>').join(''); } $('search').addEventListener('input',render);Promise.all([fetch('/schedule.json').then(r=>r.json()),fetch('/api/reports').then(r=>r.ok?r.json():[]).catch(()=>[])]).then(([s,r])=>{schedule=s;reports=r;render();renderSchedule()}).catch(()=>{$('cards').textContent='Unable to load opponent schedule.'});
</script></body></html>
