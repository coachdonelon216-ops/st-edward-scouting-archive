<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload Scouting Reports | St. Edward</title><style>body{font:16px system-ui;background:#102017;color:white;max-width:740px;margin:45px auto;padding:20px}h1{color:#e6c767}label{display:block;margin:20px 0 6px}input,button{padding:12px;border-radius:6px;border:1px solid #ccc;font:inherit}input{max-width:95%;width:100%;box-sizing:border-box}button{background:#e6c767;color:#132319;font-weight:bold;cursor:pointer;margin-top:20px}a{color:#e6c767}#result{white-space:pre-wrap;padding:15px}</style><h1>Administrator PDF Upload</h1><p>Upload scouting reports to the public St. Edward Basketball archive. Each PDF is stored in the connected GitHub repository and published when Render redeploys.</p><p><a href="/">Back to archive</a></p><form id="form"><label>Administrator password</label><input id="password" type="password" autocomplete="current-password" required><label>Opponent (optional)</label><input name="team" placeholder="Opponent name"><label>Season</label><input name="season" placeholder="2026-27" value="2026-27"><label>PDF files (up to 20 per batch; 20 MB each)</label><input name="reports" type="file" accept=".pdf,application/pdf" multiple required><button id="send">Upload PDFs</button></form><div id="result" role="status"></div><script>fetch('/api/upload-status').then(r=>r.json()).then(d=>{if(!d.ready)document.getElementById('result').textContent='Setup required: the site administrator must configure ADMIN_PASSWORD and GITHUB_TOKEN on Render before uploads can begin.'});document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('send'),out=document.getElementById('result');btn.disabled=true;out.textContent='Uploading...';try{const body=new FormData(e.target),password=document.getElementById('password').value;body.delete('password');const r=await fetch('/api/upload',{method:'POST',headers:{'x-admin-password':password},body});const data=await r.json();out.textContent=r.ok?'Uploaded '+data.uploaded+' PDF(s). '+data.note+(data.errors.length?' Errors: '+JSON.stringify(data.errors):''):data.error||'Upload failed'}catch(err){out.textContent='Upload failed: '+err.message}finally{btn.disabled=false}})</script></html>
