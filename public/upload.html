<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add PDF | SEHSBasketballScout</title><style>.home-eagle{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-right:10px}.home-eagle img{width:66px;height:60px;object-fit:contain}.home-eagle:focus-visible{outline:2px solid #f4c84a;outline-offset:3px}@media print{.home-eagle{display:none!important}}</style><style>:root{font-family:system-ui,Arial,sans-serif;color:#edf5ee;background:#0b1912}*{box-sizing:border-box}body{max-width:760px;margin:0 auto;padding:24px}h1{color:#eac43e}a{color:#eac43e}form{background:#143523;border:1px solid #47714d;padding:24px;border-radius:14px}label{display:block;font-weight:700;margin:16px 0 6px}input,select{display:block;width:100%;padding:12px;background:#092016;color:#fff;border:1px solid #77967b;border-radius:7px;font:inherit}button{background:#eac43e;color:#142618;border:0;border-radius:8px;padding:13px 22px;margin-top:22px;font-weight:800;cursor:pointer}button:disabled{opacity:.5}#status{margin:18px 0;white-space:pre-wrap}</style></head><body><p><a href="/" aria-label="Return to home screen" title="Back to Home Screen" class="home-eagle"><img src="/01-SEHS-Eagle-E.png" alt="St. Edward Eagle head"></a> <a href="/">← Back to scouting archive</a></p><h1>Add Scouting PDF</h1><p>Enter the opponent, game date, and season, then select one or more scouting reports. Anyone can submit scouting reports for review.</p><form id="upload"><label for="team">Opponent</label><input id="team" name="team" required maxlength="100" placeholder="e.g. St. Ignatius"><label for="date">Date of game</label><input id="date" name="date" type="date" required><label for="season">Season</label><select id="season" name="season" required><option value="">Choose a season</option><option>2026-27</option><option>2025-26</option><option>2024-25</option><option>2023-24</option><option>2022-23</option><option>2021-22</option><option>2020-21</option><option>2019-20</option><option>2018-19</option></select><label for="reports">PDF report(s)</label><input id="reports" name="reports" type="file" accept=".pdf,application/pdf" multiple required><small>Up to 20 PDFs per upload, maximum 20 MB each.</small><button id="send" type="submit">Upload PDF</button></form><div id="status" role="status" aria-live="polite"></div><script>const form=document.getElementById('upload'),status=document.getElementById('status'),send=document.getElementById('send');fetch('/api/upload-status').then(r=>r.json()).then(d=>{if(!d.ready)status.textContent='Upload configuration required: set GITHUB_TOKEN in Render Environment.'}).catch(()=>{});form.addEventListener('submit',async e=>{e.preventDefault();send.disabled=true;status.textContent='Uploading PDF(s)...';try{const body=new FormData(form);const response=await fetch('/api/upload',{method:'POST',body});const result=await response.json();if(!response.ok||result.errors?.length){const details=(result.errors||[]).map(x=>(x.name||'File')+': '+x.error).join('\n');if(!response.ok)throw Error([result.error,details,details?'':'Upload failed (HTTP '+response.status+')'].filter(Boolean).join('\n'));status.textContent='Uploaded '+result.uploaded+' PDF(s). '+(result.note||'')+(details?'\nSome files failed:\n'+details:'');if(result.uploaded)form.reset()}else{status.textContent='Successfully uploaded '+result.uploaded+' PDF(s). '+(result.note||'');form.reset()}}catch(err){status.textContent=err.message}finally{send.disabled=false}})</script></body></html>
