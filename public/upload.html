<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload Scouting Reports | St. Edward</title><style>body{font:16px system-ui;background:#102017;color:white;max-width:740px;margin:45px auto;padding:20px}h1{color:#e6c767}label{display:block;margin:20px 0 6px}input,button{padding:12px;border-radius:6px;border:1px solid #ccc;font:inherit}input{max-width:95%;width:100%;box-sizing:border-box}button{background:#e6c767;color:#132319;font-weight:bold;cursor:pointer;margin-top:20px}a{color:#e6c767}#result{white-space:pre-wrap;padding:15px}</style><h1>Administrator PDF Upload</h1><p>Upload scouting reports to the public St. Edward Basketball archive. Each PDF is stored in the connected GitHub repository and published when Render redeploys.</p><p><a href="/">Back to archive</a></p><section id="loginPanel"><h2>Administrator Login</h2><form id="login"><label for="password">Administrator password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button></form></section><section id="uploadPanel" hidden><h2>Upload Scouting Reports</h2><button id="logout" type="button">Sign out</button><form id="form"><label>Opponent (optional)</label><input name="team" placeholder="Opponent name"><label>Season</label><input name="season" placeholder="2026-27" value="2026-27"><label>PDF files (up to 20 per batch; 20 MB each)</label><input name="reports" type="file" accept=".pdf,application/pdf" multiple required><button id="send">Upload PDFs</button></form></section><div id="result" role="status"></div><script>
const el=id=>document.getElementById(id),out=el('result');
async function refresh(){const r=await fetch('/api/admin/session',{cache:'no-store'}),d=await r.json();el('loginPanel').hidden=d.loggedIn;el('uploadPanel').hidden=!d.loggedIn;if(!d.configured)out.textContent='Administrator setup required: set ADMIN_PASSWORD in Render Environment.';else if(d.loggedIn&&!d.uploadsReady)out.textContent='Login successful. To enable uploads, configure GITHUB_TOKEN in Render Environment.'}
el('login').onsubmit=async e=>{e.preventDefault();out.textContent='Signing in...';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:el('password').value})});const d=await r.json();el('password').value='';out.textContent=r.ok?'Signed in.':d.error||'Login failed';await refresh()}catch(e){out.textContent=e.message}};
el('logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});out.textContent='Signed out';await refresh()};
el('form').onsubmit=async e=>{e.preventDefault();const btn=el('send');btn.disabled=true;out.textContent='Uploading...';try{const r=await fetch('/api/upload',{method:'POST',body:new FormData(e.target)});const d=await r.json();out.textContent=r.ok?'Uploaded '+d.uploaded+' PDF(s). '+d.note+(d.errors.length?' Errors: '+JSON.stringify(d.errors):''):d.error||'Upload failed';if(r.status===401)await refresh()}catch(err){out.textContent='Upload failed: '+err.message}finally{btn.disabled=false}};refresh().catch(e=>out.textContent='Unable to check login status: '+e.message);
</script><style>[hidden]{display:none!important}</style></html>
