<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>St. Edward Basketball Scouting Archive</title><style>body{margin:0;background:#101411;color:#f5f5f5;font:16px system-ui,sans-serif}header{background:#12643d;border-bottom:5px solid #e0bd57;text-align:center;padding:36px 15px}h1{margin:0;font-size:clamp(2rem,5vw,3.5rem)}main{max-width:1050px;margin:auto;padding:25px}h2{color:#e0bd57}input,select{padding:12px;background:#fff;border:0;border-radius:5px;margin:4px;max-width:90%}.card{background:#1d2620;border:1px solid #39473e;border-radius:8px;padding:14px;margin:10px 0}.muted{color:#c4cfc6}a{color:#f4d781}a:hover{text-decoration:none}.tools{display:flex;flex-wrap:wrap;gap:8px}#count{margin:14px 0}</style></head><body><header><h1>ST. EDWARD BASKETBALL</h1><p>SCOUTING ARCHIVE</p></header><main><p><a href="/upload.html">Administrator: Upload scouting reports</a></p><h2>Scouting Reports</h2><div class="tools"><input id="q" type="search" placeholder="Search opponent or report" aria-label="Search reports"><select id="season" aria-label="Filter by season"><option value="">All seasons</option></select></div><p id="count" class="muted">Loading reports...</p><div id="reports"></div><h2>2026–27 Schedule</h2><div id="schedule">Loading schedule...</div></main><script>let all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let q=document.getElementById('q').value.toLowerCase(),s=document.getElementById('season').value;let shown=all.filter(r=>(!s||r.season===s)&&[r.name,r.team,r.season,r.date].some(v=>String(v||'').toLowerCase().includes(q)));document.getElementById('count').textContent=shown.length+' of '+all.length+' reports';document.getElementById('reports').innerHTML=shown.map(r=>'<div class="card"><strong>'+esc(r.team||r.name)+'</strong><div class="muted">'+esc(r.season)+' · '+esc(r.date||'Date unverified')+'</div><a href="reports/'+encodeURIComponent(r.file)+'" target="_blank" rel="noopener">View PDF</a></div>').join('')||'<p>No matching reports.</p>'}fetch('reports.json').then(r=>{if(!r.ok)throw Error('Missing index');return r.json()}).then(rows=>{all=rows;let seasons=[...new Set(rows.map(r=>r.season).filter(Boolean))].sort().reverse();document.getElementById('season').innerHTML+=[...seasons].map(s=>'<option>'+esc(s)+'</option>').join('');render()}).catch(()=>document.getElementById('count').textContent='Report index unavailable.');document.getElementById('q').addEventListener('input',render);document.getElementById('season').addEventListener('change',render);fetch('schedule.json').then(r=>r.json()).then(rows=>{document.getElementById('schedule').innerHTML=rows.map(r=>'<div class="card"><strong>'+esc(r.date)+'</strong> · '+esc(r.site)+' '+esc(r.team)+'</div>').join('')}).catch(()=>document.getElementById('schedule').textContent='Schedule unavailable.');</script></body></html>
